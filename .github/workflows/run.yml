name: Real Price Scraper

on:
  schedule:
    - cron: '0 2 1 * *'  # 매월 1일 11:00 KST
  workflow_dispatch:

jobs:
  fetch-and-analyze:
    runs-on: ubuntu-latest
    env:
      API_KEY: ${{ secrets.API_KEY }}

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run collector
      run: python scripts/collect_price.py
    - name: Commit results
      run: |
        git config --global user.name 'github-actions'
        git config --global user.email 'github-actions@github.com'
        git add data/output.csv data/report.md
        git commit -m "auto: update report for ${DEAL_YM}" || echo "No changes to commit"
        git push
